[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poisson"
version = "0.0.1"
description = "Helpers for Poisson FEM verification (dielectric interface & image-charge)"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["poisson*"]
exclude = ["verify*"]
